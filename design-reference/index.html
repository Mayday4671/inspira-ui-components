<script>
(()=>{

 document.getElementById('demoSize')?.addEventListener('change',e=>{ui.size=e.target.value;updateMainDemo()});document.getElementById('demoText')?.addEventListener('input',e=>{ui.buttonText=e.target.value;updateMainDemo()});document.getElementById('demoLoading')?.addEventListener('change',e=>{ui.loading=e.target.checked;updateMainDemo()});document.getElementById('demoDisabled')?.addEventListener('change',e=>{ui.disabled=e.target.checked;updateMainDemo()});document.getElementById('resetPreview')?.addEventListener('click',()=>{ui.size='default';ui.buttonText='开始探索';ui.loading=false;ui.disabled=false;ui.previewTab='预览';navigate();toast('演示参数已重置')});document.getElementById('toggleSource')?.addEventListener('click',()=>{const x=document.getElementById('inlineSource');if(!x)return;x.style.display=x.style.display==='none'?'block':'none'});
 document.querySelectorAll('[data-ripple]').forEach(x=>x.addEventListener('click',ripple));document.querySelectorAll('[data-hero-cta]').forEach(x=>x.addEventListener('click',()=>{location.hash='#/component/shimmer-button'}));document.querySelectorAll('[data-open-modal]').forEach(x=>x.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();openDemoModal()}));document.getElementById('menuBackdrop')?.addEventListener('click',closeSidebar);
 document.querySelectorAll('.toc a').forEach(a=>a.addEventListener('click',e=>{e.preventDefault();const target=document.getElementById(a.dataset.anchor);if(target){history.replaceState(null,'',location.href.split('#')[0]+'#/'+route());target.scrollIntoView({behavior:'smooth',block:'start'});document.querySelectorAll('.toc a').forEach(x=>x.classList.toggle('active',x===a));}}));
 }
function updateMainDemo(){const b=document.getElementById('mainDemoButton'),c=sampleComponent();if(!b)return;b.textContent=ui.loading?'加载中…':ui.buttonText+' →';b.disabled=ui.disabled||ui.loading;b.style.fontSize=ui.size==='small'?'11px':ui.size==='large'?'16px':'13px';b.style.padding=ui.size==='small'?'9px 13px':ui.size==='large'?'17px 29px':'13px 20px';const inline=document.getElementById('inlineSource');if(inline)inline.innerHTML=codeBox(example(c));}
function ripple(e){const b=e.currentTarget,r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),i=document.createElement('i');i.style.cssText=`width:${d}px;height:${d}px;left:${e.clientX-r.left-d/2}px;top:${e.clientY-r.top-d/2}px`;b.appendChild(i);setTimeout(()=>i.remove(),680)}
function toast(msg){document.querySelector('.toast')?.remove();const x=document.createElement('div');x.className='toast';x.textContent=msg;document.getElementById('portal').appendChild(x);setTimeout(()=>x.remove(),2100)}
function setTheme(mode){ui.theme=mode;document.body.classList.toggle('dark',mode==='dark');storage.setItem('inspira-demo-theme',mode);document.getElementById('themeBtn').innerHTML=icon(mode==='dark'?'sun':'moon');toast(mode==='dark'?'已切换深色主题':'已切换浅色主题')}
function closeSidebar(){ui.sideOpen=false;document.getElementById('sidebar')?.classList.remove('open');document.getElementById('menuBackdrop')?.classList.remove('show')}
function openDemoModal(){const root=document.getElementById('portal');root.insertAdjacentHTML('beforeend',`<div class="modal-overlay" id="demoModal"><div class="app-modal" role="dialog" aria-modal="true" aria-label="演示弹窗"><h3>欢迎体验 Inspira UI ✨</h3><p>这是一段真实可操作的原型交互：可通过按钮、遮罩或 Escape 关闭，并有明确反馈。</p><footer><button class="btn" data-close-demo>取消</button><button class="btn primary" data-confirm-demo>确认</button></footer></div></div>`);root.querySelector('#demoModal').addEventListener('click',e=>{if(e.target.id==='demoModal'||e.target.closest('[data-close-demo]'))closeModal();if(e.target.closest('[data-confirm-demo]')){closeModal();toast('操作已确认')}});root.querySelector('[data-confirm-demo]')?.focus();}
function closeModal(){document.getElementById('demoModal')?.remove()}
function openSearch(){if(document.getElementById('searchOverlay'))return;closeSidebar();const p=document.getElementById('portal');p.insertAdjacentHTML('beforeend',`<div class="overlay" id="searchOverlay"><div class="search-dialog" role="dialog" aria-modal="true" aria-label="搜索组件"><div class="dialog-search">${icon('search')}<input id="globalSearch" autofocus type="search" placeholder="搜索组件、指南…" aria-label="搜索关键字"/><kbd class="kbd">ESC</kbd></div><div id="searchResults" class="dialog-results"></div><div class="dialog-foot">↑ ↓ 浏览　·　Enter 跳转　·　ESC 关闭</div></div></div>`);document.getElementById('searchOverlay').addEventListener('click',e=>{if(e.target.id==='searchOverlay')closeSearch()});const input=document.getElementById('globalSearch');input.focus();drawSearchResults('');input.addEventListener('input',e=>drawSearchResults(e.target.value));input.addEventListener('keydown',e=>{const arr=[...document.querySelectorAll('.dialog-result')];let sel=arr.findIndex(x=>x.classList.contains('selected'));if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=(sel+(e.key==='ArrowDown'?1:-1)+arr.length)%arr.length;arr.forEach((x,i)=>x.classList.toggle('selected',i===sel));arr[sel]?.focus()}if(e.key==='Enter'&&arr.length){e.preventDefault();(arr[sel>=0?sel:0])?.click()}})}
function drawSearchResults(query){const q=query.toLowerCase().trim();const items=[...shortcuts,...components.map(x=>({name:x.name+' · '+x.zh,slug:'#/component/'+x.slug,category:x.category}))].filter(x=>(x.name+' '+x.category).toLowerCase().includes(q)).slice(0,12);document.getElementById('searchResults').innerHTML=`<div class="dialog-caption">${q?'搜索结果':'快捷入口 · 组件'}</div>`+(items.length?items.map(x=>`<a class="dialog-result" href="${x.slug}">${icon(x.category==='指南'?'book':x.category==='目录'?'grid':'spark','small')}<span>${esc(x.name)}</span><small>${esc(x.category)}</small></a>`).join(''):'<div class="empty-state" style="border:0;padding:32px">未找到匹配的组件</div>');document.querySelectorAll('.dialog-result').forEach(el=>el.addEventListener('click',closeSearch))}
function closeSearch(){document.getElementById('searchOverlay')?.remove()}
document.getElementById('searchBtn').addEventListener('click',openSearch);document.getElementById('themeBtn').addEventListener('click',()=>setTheme(ui.theme==='light'?'dark':'light'));document.getElementById('mobileMenuBtn').addEventListener('click',()=>{const sb=document.getElementById('sidebar');if(!sb){location.hash='#/components';ui.sideOpen=true;return;}ui.sideOpen=!ui.sideOpen;sb.classList.toggle('open',ui.sideOpen);document.getElementById('menuBackdrop')?.classList.toggle('show',ui.sideOpen)});document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openSearch()}if(e.key==='Escape'){closeSearch();closeModal();closeSidebar()}});document.addEventListener('click',e=>{const b=e.target.closest('[data-copy]');if(b){const value=decodeURIComponent(b.dataset.copy);navigator.clipboard?.writeText(value).then(()=>toast('代码已复制到剪贴板')).catch(()=>fallbackCopy(value));if(!navigator.clipboard)fallbackCopy(value)}const db=e.target.closest('#mainDemoButton');if(db&&!db.disabled&&sampleComponent().prev==='ripple')ripple({currentTarget:db,clientX:e.clientX,clientY:e.clientY})});function fallbackCopy(str){const t=document.createElement('textarea');t.value=str;document.body.appendChild(t);t.select();try{document.execCommand('copy');toast('代码已复制到剪贴板')}catch(e){toast('复制失败，请手动选中代码')}t.remove()};window.addEventListener('hashchange',()=>{if(document.getElementById('sidebar'))ui.sideOpen=false;navigate()});document.body.classList.toggle('dark',ui.theme==='dark');document.getElementById('themeBtn').innerHTML=icon(ui.theme==='dark'?'sun':'moon');if(!location.hash)history.replaceState(null,'','#/home');navigate();
})();
</script>
